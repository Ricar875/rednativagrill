const K='nativa_v3',$=s=>document.querySelector(s),R=n=>'R$ '+Math.round(n).toLocaleString('pt-BR'),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),CL=['#e8b53a','#c0201a','#3fbf6a','#e8e0cf','#4a9be8'],hora=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),WA='https://wa.me/5575991771095?text=';

function form(col,i){M={col,i};const c=CF[col],o=i==null?{}:gc(col)[i];$('#md').hidden=false;$('#md').innerHTML=`<div class="bx"><h3>${i==null?'Novo':'Editar'} · ${c.t}</h3>${c.f.map(([k,l,t])=>`<label>${l}${Array.isArray(t)?`<select name="${k}">${t.map(x=>`<option ${o[k]==x?'selected':''}>${x}</option>`).join('')}</select>`:`<input name="${k}" type="${t=='n'?'number':'text'}" step="any" value="${E(o[k]??'')}">`}</label>`).join('')}<div class="row"><button class="b" data-a="save">Salvar</button><button class="b r" data-a="close">Cancelar</button></div></div>`}

sim:()=>{S.g=parseFloat($('#g').value)||0;P();render()},print:()=>print(),sendw:()=>{if(!S.wish.length)return toast('Adicione um pedido primeiro');open(WA+encodeURIComponent('Pedidos do Sr. Gilson para o sistema Nativa Grill:\n'+S.wish.map((x,i)=>(i+1)+'. ['+x.pr+'] '+x.t+(x.d?' - '+x.d:'')).join('\n')),'_blank')},
